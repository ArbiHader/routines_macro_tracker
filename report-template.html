<!--
  Macro Radar report template — the stable CSS/layout shell.
  The tail fills the REPORT_CONTENT placeholder with report.md rendered to HTML,
  wrapping each <table> in <div class="table-scroll">. Self-contained (inline CSS only)
  to satisfy the artifact CSP. Do not add external scripts, styles, fonts, or images.
-->
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#e4e4e4; --card:#f7f8fa; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15171a; --fg:#e8e8e8; --muted:#9aa0a6; --line:#2c2f34; --card:#1c1f24; }
  }
  body { background: var(--bg); color: var(--fg); margin: 0; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 64px;
          font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap h1 { font-size: 24px; margin: 0 0 4px; }
  .wrap h2 { font-size: 19px; margin: 32px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .wrap h3 { font-size: 16px; margin: 22px 0 8px; }
  .wrap p { margin: 8px 0; }
  .muted, .wrap small { color: var(--muted); }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 12px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  td { overflow-wrap: anywhere; }
  code { background: var(--card); padding: 1px 5px; border-radius: 4px; }
  blockquote { margin: 10px 0; padding: 8px 14px; border-left: 3px solid var(--line); color: var(--muted); }
</style>

<div class="wrap">
<!-- REPORT_CONTENT -->
</div>
